<div class="wrap doc">
  <aside class="toc">
    <details class="glass" open>
      <summary>Contents</summary>
      <nav aria-label="contents"><b>Contents</b>{{SPEC_TOC}}</nav>
    </details>
  </aside>
  <div>
    <div class="doc-meta">
      <a class="chip" href="/spec/test-vectors.json">{{icon:download}}test-vectors.json</a>
      <a class="chip" href="/spec/glyphs.json">{{icon:download}}glyphs.json</a>
      <a class="chip" href="/sheet.svg">{{icon:printer}}sheet</a>
      <a class="chip" href="/spec/glyphs-v1.svg">{{icon:printer}}format 1 sheet</a>
      <a class="chip" href="https://github.com/arkin0x/glyphbyte/blob/main/spec/GLYPHBYTE.md">{{icon:terminal}}source</a>
    </div>
    <article class="prose card">
{{SPEC_HTML}}
    </article>
    <p class="fine">Rendered from <code>spec/GLYPHBYTE.md</code>. Reference rows and photos: {{VECTOR_LINKS}}.</p>
  </div>
</div>
<script>
// highlight the section being read in the contents; on a phone the contents start folded
(function () {
  const links = Array.from(document.querySelectorAll('.toc a')), byId = new Map(links.map(a => [decodeURIComponent(a.hash.slice(1)), a]));
  if (matchMedia('(max-width: 999px)').matches) document.querySelector('.toc details').open = false;
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    links.forEach(a => a.classList.remove('active')); const a = byId.get(e.target.id); if (a) a.classList.add('active');
  }), { rootMargin: '-80px 0px -70% 0px' });
  document.querySelectorAll('.prose h2[id]').forEach(h => io.observe(h));
})();
</script>
