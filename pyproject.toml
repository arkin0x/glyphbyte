[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symple-cli"
version = "0.1.0"
description = "Recognize hand-drawn symple symbols in photos and turn them into bytes. One symbol, one byte, no network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.16",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16"]
dev = ["pytest>=7"]

[project.scripts]
symple = "symple.cli:main"

[tool.setuptools]
packages = ["symple"]

[tool.setuptools.package-data]
symple = ["data/*.json", "data/*.onnx"]
