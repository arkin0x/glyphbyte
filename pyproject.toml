[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphbyte"
version = "0.1.0"
description = "Recognize hand-drawn glyphbyte symbols in photos and turn them into bytes. One symbol, one byte, no network."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-SA-4.0" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.16",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16", "onnx>=1.15"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7"]

[project.scripts]
glyphbyte = "glyphbyte.cli:main"

[tool.setuptools]
packages = ["glyphbyte", "glyphbyte.data", "glyphbyte.static"]

[tool.setuptools.package-data]
glyphbyte = ["data/*.json", "data/*.onnx", "static/*.html"]
